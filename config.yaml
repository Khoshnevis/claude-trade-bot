# =============================================================================
# Trade bot configuration
# -----------------------------------------------------------------------------
# All money figures are in the account's deposit currency.
# Timeframes accept MT5 names: M1 M5 M15 M30 H1 H4 D1 W1 MN1
# The MT5 terminal is assumed to be ALREADY LOGGED IN; no credentials are used.
# =============================================================================

mt5:
  # Path to terminal64.exe. Leave null to let the package auto-discover the
  # running terminal. Only set this if auto-discovery fails.
  terminal_path: null
  # Magic number stamps every order this bot places so it never touches
  # positions opened by humans or other EAs.
  magic: 770088
  # Max acceptable slippage in points when sending market orders.
  deviation_points: 20

engine:
  timeframe: H1            # bar cadence the bot trades on
  poll_seconds: 15         # how often to check for a new closed bar
  history_bars: 1500       # bars pulled per symbol each cycle
  reconcile_seconds: 300   # how often to reconcile state vs broker
  # Trading blackout windows (broker server time, HH:MM-HH:MM, 24h).
  # Avoid the daily rollover spread widening (~17:00 New York).
  blackouts:
    - "23:55-00:10"

risk:
  risk_per_trade: 0.005          # 0.5% of equity risked per trade
  max_risk_per_trade: 0.01       # hard ceiling
  max_portfolio_heat: 0.04       # sum of open risk capped at 4% of equity (allows ~8 concurrent)
  max_open_positions: 8
  max_correlated_same_dir: 1     # max same-direction positions among correlated symbols
  atr_period: 14
  atr_stop_mult: 2.0             # stop distance = atr_stop_mult * ATR
  atr_target_mult: 3.0           # take-profit distance for directional trades
  drawdown_kill_pct: 0.12        # flatten + halt new trades at 12% DD from high-water mark
  daily_loss_kill_pct: 0.03      # halt new trades for the day at 3% daily loss
  min_volume_guard: true         # skip trades whose computed lot < symbol volume_min

# Correlated clusters: the bot will not stack same-direction trend trades
# across symbols inside one cluster (treats them as one risk unit).
correlation_clusters:
  - [EURUSD, GBPUSD]
  - [AUDUSD, NZDUSD]
  - [USDCAD]

# -----------------------------------------------------------------------------
# Engine 1: Kalman / cointegration mean-reversion pairs (market-neutral core)
# -----------------------------------------------------------------------------
pairs:
  enabled: true
  # Economically-linked candidates only. y = symbol_a, x = symbol_b.
  pairs:
    - { a: EURUSD, b: GBPUSD }
    - { a: AUDUSD, b: NZDUSD }
  delta: 1.0e-4            # Kalman state transition noise (hedge-ratio drift)
  ve: 1.0e-3              # Kalman measurement noise
  entry_z: 2.0             # enter when |z| crosses this
  exit_z: 0.3              # exit when |z| falls back inside this
  stop_z: 4.0             # hard stop if spread blows out beyond this
  warmup_bars: 250         # Kalman burn-in before signals are trusted
  # FX cointegration at intraday cadence is rare/unstable, so the hard gate was
  # blocking ~99% of bars. We rely on the Kalman z-score (stop_z is the safety
  # net) and keep cointegration available as an OPTIONAL stricter filter.
  recheck_coint: false     # set true to require Engle-Granger cointegration
  coint_pvalue: 0.10
  coint_lookback: 500
  coint_recheck_bars: 25   # re-test cointegration every N bars (caches between; speeds backtests)

# -----------------------------------------------------------------------------
# Engine 2: Regime-filtered slow trend / momentum overlay
# -----------------------------------------------------------------------------
trend:
  enabled: true
  symbols: [EURUSD, USDJPY, AUDUSD, USDCAD]
  # Multi-timeframe confirmation: DIRECTION + REGIME are read from this higher
  # "context" timeframe, while the ENTRY breakout fires on engine.timeframe.
  # Set to null to disable MTF and use the base timeframe for everything.
  context_timeframe: H4
  fast_ma: 50              # MAs are computed on context_timeframe (direction)
  slow_ma: 200
  donchian: 55             # breakout window on the base timeframe (entry)
  # Trend-following exit: a fixed take-profit caps the rare big winners that ARE
  # the edge. Instead let winners run with an ATR trailing (chandelier) stop.
  use_trailing: true       # if true, NO fixed TP; trail the stop behind price
  trail_atr_mult: 3.0      # trailing distance = this * ATR-at-entry
  # HMM regime gate: only take trend trades when regime == trending.
  # Disabled by default: in testing it vetoed 100% of valid breakout setups
  # (too aggressive). Re-enable only if it measurably improves the Sharpe.
  use_hmm_regime: false
  hmm_states: 3
  hmm_retrain_bars: 500    # refit the HMM every N bars
  hmm_lookback: 1000       # bars used to fit the HMM

# -----------------------------------------------------------------------------
# Backtest cost model (used ONLY by backtest.py, never by live trading).
# Be conservative here: understating costs is the classic way to fool yourself.
# Pips are fractional-pip aware (pip = 10 * point on 3/5-digit symbols).
# -----------------------------------------------------------------------------
backtest:
  start_equity: 1000.0
  bars: 4000                       # base-timeframe bars of history to replay
  history_window: 1000             # bars fed to the engines each step (mirrors live)
  commission_per_lot_per_side: 3.5 # account currency, per 1.0 lot, per side (raw/ECN)
  slippage_pips: 0.2               # applied per side
  spread_pips:                     # round-turn spread paid; per-symbol overrides
    default: 0.8
    EURUSD: 0.6
    GBPUSD: 0.9
    USDJPY: 0.7
    AUDUSD: 0.9
    NZDUSD: 1.2
    USDCAD: 1.0

# -----------------------------------------------------------------------------
# Engine 3: Single-instrument swing-reversal / mean-reversion (higher frequency)
# Detect a swing top/bottom, confirm with RSI + stretch-from-mean, enter sized
# by risk. SL/TP are SOFT -- monitored by the bot on every poll, not parked on
# the broker. Several concurrent positions across symbols are allowed.
# -----------------------------------------------------------------------------
reversal:
  enabled: true
  symbols: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, EURJPY, GBPJPY]
  rsi_period: 14
  rsi_oversold: 30          # long when RSI <= this (raise to ~35 for more trades)
  rsi_overbought: 70        # short when RSI >= this (lower to ~65 for more trades)
  ma_period: 50             # mean used for stretch + reversion target
  stretch_atr: 1.0          # price must be >= this many ATR from the mean
  pivot_lookback: 20        # window to detect the swing high/low
  pivot_confirm: 2          # swing must be within this many bars + price turning
  stop_atr: 1.5             # SOFT stop distance (also drives position sizing)
  target_atr: 3.0           # SOFT take-profit cap (mean-reversion exit may fire first)
  max_per_symbol: 1         # no pyramiding within a symbol

persistence:
  db_path: state.sqlite

logging:
  level: INFO
  file: trade_bot.log
